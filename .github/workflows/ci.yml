name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test_nextflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Nextflow
        run: |
          curl -fL https://github.com/nextflow-io/nextflow/releases/download/v24.10.5/nextflow -o nextflow
          chmod +x nextflow
          ./nextflow -version
          sudo mv nextflow /usr/local/bin/
      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          version: 0.9.5
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Build Docker images
        run: just build
      - name: Run nf-test
        run: just test-nextflow

  test_pure_python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [horn-core, horn-drivers]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -e packages/horn-core
          pip install -e "packages/horn-drivers[test]"
          pip install pytest
      - name: Run tests
        run: pytest packages/${{ matrix.package }}/tests -v

  test_reference_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependencies
        run: pip install -e packages/horn-core -e packages/horn-drivers -e packages/horn-analysis pytest
      - name: Check reference-audit evidence safeguards
        run: pytest scripts/tests -v

  test_packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [horn-geometry, horn-solver, horn-analysis]
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build -t ${{ matrix.package }}:test --target test -f ./packages/${{ matrix.package }}/Dockerfile .
      - name: Run tests (skip validation on PRs)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker run --rm ${{ matrix.package }}:test pytest /app/packages/${{ matrix.package }}/tests -v -m "not validation"
          else
            docker run --rm ${{ matrix.package }}:test pytest /app/packages/${{ matrix.package }}/tests -v
          fi
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push production image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./packages/${{ matrix.package }}/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.package }}:latest
